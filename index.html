<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Apple Group | Hotels & Bakery</title>

  <meta
    name="description"
    content="Apple Group of Hotels and Apple Bakery - Comfortable stays, warm hospitality and delicious bakery products."
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      color: #222;
      background: #f7f7f5;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #1d3328;
      color: white;
      padding: 16px 6%;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    nav {
      display: flex;
      gap: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    nav a:hover {
      color: #d4af37;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 580px;
      background:
        linear-gradient(
          135deg,
          rgba(16, 42, 31, .92),
          rgba(0, 0, 0, .55)
        ),
        url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1600&q=80')
        center/cover;

      display: flex;
      align-items: center;
      color: white;
      padding: 70px 6%;
    }

    .hero-content {
      max-width: 750px;
    }

    .hero p {
      color: #d4af37;
      letter-spacing: 3px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 78px);
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: #d4af37;
    }

    .hero h2 {
      font-size: 22px;
      font-weight: normal;
      margin-bottom: 30px;
    }

    /* =========================
       BUTTONS
    ========================= */

    .btn {
      display: inline-block;
      padding: 14px 26px;
      background: #d4af37;
      color: #1d3328;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      margin-right: 10px;
      margin-top: 10px;
      transition: 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      color: white;
      border: 2px solid white;
    }

    /* =========================
       GENERAL SECTIONS
    ========================= */

    section {
      padding: 80px 6%;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .section-tag {
      color: #b48a10;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 40px;
      color: #1d3328;
      margin-bottom: 15px;
      line-height: 1.2;
    }

    .section-text {
      max-width: 700px;
      color: #666;
      margin-bottom: 35px;
    }

    /* =========================
       HOTEL CARDS
    ========================= */

    .hotel-grid,
    .bakery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, .08);
      transition: 0.3s ease;
    }

    .card:hover {
      transform: translateY(-8px);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 22px;
    }

    .card h3 {
      font-size: 24px;
      color: #1d3328;
      margin-bottom: 10px;
    }

    .card p {
      color: #666;
      margin-bottom: 15px;
    }

    .card a {
      color: #a77d0a;
      font-weight: bold;
      text-decoration: none;
    }

    /* =========================
       APPLE BAKERY
    ========================= */

    .bakery {
      background: #1d3328;
      color: white;
    }

    .bakery .section-tag {
      color: #d4af37;
    }

    .bakery .section-title {
      color: white;
    }

    .bakery .section-text {
      color: #ddd;
    }

    .product-card {
      background: white;
      color: #222;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
    }

      object-fit: cover;
