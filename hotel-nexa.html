<script>
function sendWhatsAppBooking() {

    const guestName = document.getElementById("guestName").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const checkIn = document.getElementById("checkIn").value;
    const checkOut = document.getElementById("checkOut").value;
    const adults = document.getElementById("adults").value;
    const children = document.getElementById("children").value;
    const roomPreference = document.getElementById("roomPreference").value;
    const specialRequest = document.getElementById("specialRequest").value.trim();

    if (!guestName || !mobile || !checkIn || !checkOut) {
        alert("Please fill all required booking details.");
        return;
    }

    const formatDate = (date) => {
        if (!date) return "";
        const d = new Date(date);
        return d.toLocaleDateString("en-GB");
    };

    const message =
`🏨 HOTEL NEXA – BOOKING REQUEST

Hello Hotel Nexa,

I would like to enquire about a room booking.

👤 Guest Name: ${guestName}
📱 Mobile: ${mobile}
📅 Check-in: ${formatDate(checkIn)}
📅 Check-out: ${formatDate(checkOut)}
👨‍👩‍👧 Adults: ${adults}
👶 Children: ${children}
🛏️ Room Preference: ${roomPreference}
📝 Special Request: ${specialRequest || "None"}
🏨 Hotel: Hotel Nexa, Ujjain

Please confirm room availability and booking details.

Thank you.`;

    const whatsappNumber = "918770434255";

    const whatsappURL =
        "https://wa.me/" +
        whatsappNumber +
        "?text=" +
        encodeURIComponent(message);

    window.open(whatsappURL, "_blank");
}
</script>
